name: Telethon Ingest Tunnel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      PORT: "8088"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_ingest/requirements.txt
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Run ingest tunnel for five and a half hours
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_API_ID}" ] || [ -z "${TELEGRAM_API_HASH}" ] || [ -z "${TELEGRAM_SESSION_STRING}" ]; then
            echo "Telegram secrets are missing." >&2
            exit 1
          fi
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is missing." >&2
            exit 1
          fi

          SERVICE_ACCOUNT_PATH="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${SERVICE_ACCOUNT_PATH}"

          ./cloudflared tunnel --url "http://127.0.0.1:${PORT}" --no-autoupdate > "${RUNNER_TEMP}/cloudflared.log" 2>&1 &
          CLOUDFLARED_PID=$!

          cleanup() {
            python scripts/set_telethon_setting.py \
              --service-account "${SERVICE_ACCOUNT_PATH}" \
              --clear-if-run-id "${GITHUB_RUN_ID}" \
              --status stopped || true
            kill "${UVICORN_PID:-0}" 2>/dev/null || true
            kill "${CLOUDFLARED_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          PUBLIC_BASE_URL=""
          for _ in {1..90}; do
            PUBLIC_BASE_URL="$(grep -Eo 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' "${RUNNER_TEMP}/cloudflared.log" | head -n 1 || true)"
            if [ -n "${PUBLIC_BASE_URL}" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${PUBLIC_BASE_URL}" ]; then
            cat "${RUNNER_TEMP}/cloudflared.log"
            echo "Cloudflare tunnel URL was not created." >&2
            exit 1
          fi

          export PUBLIC_BASE_URL
          export FIREBASE_SERVICE_ACCOUNT="${SERVICE_ACCOUNT_PATH}"
          python -m uvicorn telegram_ingest.main:app --host 127.0.0.1 --port "${PORT}" &
          UVICORN_PID=$!

          for _ in {1..60}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null

          python scripts/set_telethon_setting.py \
            --service-account "${SERVICE_ACCOUNT_PATH}" \
            --url "${PUBLIC_BASE_URL}" \
            --run-id "${GITHUB_RUN_ID}" \
            --status online \
            --ttl-minutes 360

          echo "Telethon ingest is online at ${PUBLIC_BASE_URL}"
          sleep 19800
