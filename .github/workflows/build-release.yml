name: Build Relaxation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-web-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enable Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter config --enable-linux-desktop
      - name: User pub get
        run: flutter pub get
      - name: User analyze and test
        run: |
          flutter analyze lib test
          flutter test
      - name: Build Android release APKs
        shell: bash
        run: |
          mkdir -p build/app/outputs/relaxation-release
          RELAXATION_ABIS=arm64-v8a flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/relaxation-release/relaxation-phone-tablet-tv-arm64-v8a-release.apk
          RELAXATION_ABIS=armeabi-v7a flutter build apk --release --target-platform android-arm --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/relaxation-release/relaxation-phone-tablet-armeabi-v7a-release.apk
      - name: Build Web
        run: flutter build web
      - name: Build Linux
        run: flutter build linux
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-android-web-linux
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/relaxation-release/*.apk
            build/app/outputs/symbols/**
            build/web/**
            build/linux/**

  admin-web:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Admin pub get
        working-directory: admin_panel
        run: flutter pub get
      - name: Admin build web
        working-directory: admin_panel
        run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-admin-web
          path: admin_panel/build/web/**

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter build windows
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-windows
          path: build/windows/**

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter build macos
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-macos
          path: build/macos/**
