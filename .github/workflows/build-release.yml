name: Build Relaxation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-web-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Linux
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Flutter pub get
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Android
        run: flutter build apk --debug
      - name: Build Web
        run: flutter build web
      - name: Build Linux
        run: flutter build linux
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-android-web-linux
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/web/**
            build/linux/**

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-windows
          path: build/windows/**

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos
      - uses: actions/upload-artifact@v4
        with:
          name: relaxation-macos
          path: build/macos/**
